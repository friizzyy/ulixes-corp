" data-go="calypso"><span>Explore Calypso expertise</span><i>→</i></a></div></section><script>const S=[{"n":"Capture","o":"Front office","does":"Trade booked against product, book, counterparty, and static data","breaks":"A product modelled wrong here is inherited by every number downstream","dep":"The product model, legal entity, and book hierarchy already being right","car":"Every valuation, risk, and accounting number the trade goes on to produce"},{"n":"Valuation","o":"Front office","does":"Curves built, marks struck, independent price verification run","breaks":"Curve configuration that prices correctly and books incorrectly","dep":"Curve construction and the quotes feeding it","car":"P&L, sensitivities, and the marks the ledger posts against"},{"n":"Risk","o":"Middle office","does":"Sensitivities, limits, and the market data the measures depend on","breaks":"Risk numbers that do not tie back to what the front office holds","dep":"Positions and marks tying back to what the desk actually holds","car":"Limit monitoring, margin requirement, and capital measures"},{"n":"Collateral","o":"Middle office","does":"Margin called, exposure agreed, agreement terms applied","breaks":"Terms that live in the signed document but not in the platform","dep":"Agreement terms being represented in the platform, not only signed","car":"Funding requirement, and the disputes that follow a call"},{"n":"Settlement","o":"Back office","does":"Cash and securities move, confirmations matched, breaks worked","breaks":"Exception paths with no owner, no queue, and no resolution","dep":"Counterparty static data and instruction routing","car":"Cash and securities movement, and the breaks somebody has to own"},{"n":"Ledger","o":"Back office","does":"Sub-ledger posts, hedge designation and effectiveness carried through","breaks":"Designation that moves earnings into the wrong period, quietly","dep":"The booking model and designation decided back at capture","car":"Which period earnings land in, and what an auditor is shown"},{"n":"Regulatory reporting","o":"Back office","does":"Regulatory submissions assembled and traced back to the transaction","breaks":"A submission nobody can walk back to the trade that produced it","dep":"Every upstream identifier surviving the journey intact","car":"What the regulator receives, and what can be walked back to a trade"}];const N=[...document.querySelectorAll('.st i')];let k=0;const go=()=>{N.forEach((n,j)=>{n.classList.toggle('on',j===k);n.classList.toggle('dn',j<k)});cur.innerHTML='<b>'+S[k].n+'</b>'+S[k].o;k=(k+1)%7};go();setInterval(go,1700)</script><script>window.BT=()=>{}</script><script>
